services:
  web:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    ports:
      - target: 80
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.orcanox.rule=Host(`orcanox.xyz`) || Host(`www.orcanox.xyz`)"
        - "traefik.http.routers.orcanox.entrypoints=websecure"
        - "traefik.http.routers.orcanox.tls.certResolver=letsencrypt"
        - "traefik.http.services.orcanox.loadbalancer.server.port=80"
