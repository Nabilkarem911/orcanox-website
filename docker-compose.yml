services:
  web:
    image: nginx:alpine
    # required: without a restart policy the container stays down after a host reboot
    # and gets wiped by the docker prune cron -> Traefik route disappears (404).
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
